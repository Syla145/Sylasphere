<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1020"><title>Quiz-Editor · Sylasphere</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/jh-quiz-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/main.css?v=9"><script defer src="./js/core/app.js?v=9"></script><script defer src="./js/core/quiz-utils.js?v=9"></script><script defer src="./js/core/quiz-validator.js?v=9"></script><script defer src="./js/question-types/renderers.js?v=9"></script><script defer src="./js/editor/editor.js?v=9"></script></head><body>
<header class="container app-header"><a class="brand" href="./"><span class="brand-mark">SY</span><span>Sylasphere<small>Quiz Arena <span class="version-tag" data-app-version>v9</span> · Editor</small></span></a><div class="top-actions"><span id="autosave-state" class="autosave-state">Autosave bereit</span><a class="btn btn--ghost hide-mobile" href="./moderator.html">Moderator</a></div></header>
<main class="container editor-layout"><aside class="panel editor-sidebar"><span class="eyebrow">Quiz</span><div class="join-form" style="margin-top:12px"><label class="field-group"><span class="field-label">Titel</span><input id="edit-title" class="input"></label><label class="field-group"><span class="field-label">Beschreibung</span><textarea id="edit-description" class="input textarea" rows="3"></textarea></label><div class="form-grid"><label class="field-group"><span class="field-label">Standard-Timer</span><input id="edit-default-timer" class="input" type="number" min="0"></label><label class="field-group"><span class="field-label">Standard-Punkte</span><input id="edit-default-points" class="input" type="number" min="0"></label></div><div class="editor-toolbar"><button id="add-round" class="btn btn--primary" type="button">+ Runde</button><button id="new-quiz" class="btn btn--ghost" type="button">Neu</button></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><label class="file-drop">Quiz importieren<input id="editor-import" type="file" accept=".json,application/json"></label><button id="validate-quiz" class="btn" type="button">Quiz prüfen</button><button id="export-quiz" class="btn btn--success" type="button">JSON exportieren</button><div id="editor-validation"></div><div><span class="field-label">Erkannte Kategorien</span><div id="editor-categories" class="chip-row" style="margin-top:8px"></div></div></div></aside><section class="editor-main"><div class="panel panel-pad"><div class="section-title"><div><span class="eyebrow">Runden & Fragen</span><h1>Quiz bearbeiten</h1><p>Beliebige Kategorien sind erlaubt. Zehn Fragetypen stehen bereit – von Multiple Choice bis Live-Mehrheit, Audio und Hotspot.</p></div></div></div><div id="rounds-container"></div></section></main>
<datalist id="category-list"></datalist><div id="preview-backdrop" class="preview-backdrop" hidden><div class="panel preview-modal"><div class="preview-head"><div><span class="eyebrow">Vorschau</span><h2 style="margin:4px 0">Spieleransicht</h2></div><button id="preview-close" class="icon-btn" type="button">✕</button></div><div id="preview-content"></div></div></div>
</body></html>
