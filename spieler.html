<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>Mitspielen · Schmobin</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/schmobin-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/main.css?v=20260922-joinfix1"><script defer src="./js/core/app.js"></script><script defer src="./js/core/quiz-utils.js"></script><script defer src="./js/core/timer-engine.js"></script><script defer src="./js/core/session-engine.js"></script><script defer src="./js/question-types/renderers.js"></script><script defer src="./js/views/player-view.js?v=20260922-multiplayerfix1"></script></head><body>
