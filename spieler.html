<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>Mitspielen · Sylasphere</title><link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/jh-quiz-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./css/main.css?v=12.1"><script defer src="./js/core/app.js?v=12.1"></script><script defer src="./js/core/quiz-utils.js?v=12.1"></script><script defer src="./js/core/timer-engine.js?v=12.1"></script><script defer src="./js/core/session-engine.js?v=12.1"></script><script defer src="./js/core/firebase-service.js?v=12.1"></script><script defer src="./js/core/online-session-engine.js?v=12.1"></script><script defer src="./js/core/player-identity.js?v=12.1"></script><script defer src="./js/question-types/renderers.js?v=12.1"></script><script defer src="./js/views/player-view.js?v=12.1"></script></head><body>
<header class="container app-header"><a class="brand" href="./"><span class="brand-mark">SY</span><span>Sylasphere<small>Quiz Arena <span class="version-tag">v12.1</span> · Spieler</small></span></a></header>
<main>
<section id="join-panel" class="container join-shell"><div class="panel join-card"><span class="eyebrow">Mitspielen</span><h1>Bereit?</h1><p>Raumcode eingeben, Namen wählen und rein ins Quiz.</p><div class="join-form"><label class="field-group"><span class="field-label">Raumcode</span><input id="room-code" class="input code-input" autocomplete="one-time-code" maxlength="6" placeholder="ABC234"></label><label class="field-group"><span class="field-label">Dein Name</span><input id="player-name" class="input" maxlength="28" autocomplete="nickname" placeholder="z. B. Alex"></label><div class="field-group"><span class="field-label">Avatar</span><div id="avatar-options" class="avatar-options"></div></div><div id="join-error" class="error-text" role="alert"></div><button id="join-btn" class="btn btn--primary" type="button">Sitzung beitreten</button></div><p class="microcopy">Online-Räume funktionieren geräteübergreifend. Lokale Test-Räume bleiben auf denselben Browser/dasselbe Gerät beschränkt.</p></div></section>
<section id="game-panel" class="player-layout" hidden><div class="player-topbar"><div id="player-identity" class="brand"></div><div><span id="game-status" class="pill">Lobby</span> <span id="game-code" class="pill pill--category">------</span> <span id="game-mode" class="pill mode-pill">💻 Lokal</span></div><div><strong id="player-score">0 P</strong><div id="player-progress" class="microcopy"></div><div class="player-progress-track"><span id="player-progress-bar"></span></div></div></div><div class="player-main-grid"><div class="panel player-question-card"><div style="display:flex;justify-content:flex-end;margin-bottom:8px"><span class="pill">⏱ <b id="player-timer">–</b></span></div><div id="game-question"></div><div id="answer-feedback"></div><div class="submit-zone"><button id="submit-answer" class="btn btn--primary" type="button" hidden>Antwort abschicken</button></div></div><aside class="panel panel-pad player-leader-panel"><div class="section-title"><div><span class="eyebrow">Live</span><h2>Rangliste</h2></div></div><div id="leaderboard" class="leaderboard"></div></aside></div></section>
</main></body></html>
